version: '3.8'

services:
  # Database PostgreSQL — bisa dijalankan secara lokal di sekolah (offline)
  db:
    image: postgres:15-alpine
    container_name: sekelas-db
    environment:
      POSTGRES_DB: sekelas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API Node.js + Express
  backend:
    build: ./backend
    container_name: sekelas-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sekelas_db?schema=public
      - JWT_ACCESS_SECRET=ganti_dengan_random_string_panjang_min_32_karakter
      - JWT_ACCESS_EXPIRES_IN=7d
      - BCRYPT_SALT_ROUNDS=10
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=http://localhost:5173,http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend SPA (opsional; dapat juga dihosting statis di Vercel/Netlify)
  frontend:
    build: ./frontend
    container_name: sekelas-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api

volumes:
  postgres_data: